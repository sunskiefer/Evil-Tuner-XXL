# Evil Tuner XXL -- page layout (mpc-vst-plugins layout.conf syntax: tools/shadow_skin.py).
# GENERATED by tools/panel.py: edit that, then `python3 tools/panel.py --write`. tools/panel_art.py builds every
# control of the seven pages; this only gives MPC the tabs and their Q-Link pages.
theme_bg=101010
theme_panel=101010
theme_ink=ececec
theme_ink_dim=cfcfcf
theme_accent=f29a2e
theme_knob_ring=f29a2e
theme_seg_active=f29a2e

[tab RADIO]
knob cx=24 cy=110 r=12 label="" key=genre ns=0 bw=30
knob cx=58 cy=110 r=12 label="" key=country ns=0 bw=30
knob cx=92 cy=110 r=12 label="" key=sort ns=0 bw=30
knob cx=126 cy=110 r=12 label="" key=kbps ns=0 bw=30
knob cx=160 cy=110 r=12 label="" key=in_lvl ns=0 bw=30
knob cx=194 cy=110 r=12 label="" key=kiwi_band ns=0 bw=30
knob cx=228 cy=110 r=12 label="" key=kiwi_tune ns=0 bw=30
knob cx=262 cy=110 r=12 label="" key=kiwi_step ns=0 bw=30
knob cx=296 cy=110 r=12 label="" key=kiwi_bw ns=0 bw=30
qlinks "RADIO 1" = genre,country,sort,kbps,in_lvl
qlinks "RADIO 2" = kiwi_band,kiwi_tune,kiwi_step,kiwi_bw,in_lvl

