name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ragel scons autoconf automake libtool pkg-config autopoint gettext cmake llvm ffmpeg qemu-user
          pip install ziglang pillow numpy scipy

      - name: "Helpers cache (static: ffmpeg, et_roc, shairport-sync, for arm32 and arm64)"
        uses: actions/cache@v4
        id: helpers
        with:
          path: build/helpers
          key: helpers-v2-${{ hashFiles('helpers/**') }}

      - name: Build the helpers (both CPUs)
        if: steps.helpers.outputs.cache-hit != 'true'
        run: helpers/build_helpers.sh

      - name: Tests (x86, ASan + UBSan)
        run: test/run_tests.sh

      - name: Build (armv7 and aarch64, glibc 2.31)
        run: |
          ./build.sh > build.log 2>&1 || { tail -40 build.log; exit 1; }
          tail -3 build.log
          git diff --exit-code params.json layout.conf

      - name: Tests (ARM code, 32-bit and 64-bit, under qemu)
        run: test/arm_sim.sh

      # A release is made by a v* tag, or by a push to main whose top CHANGELOG version ("## X.Y.Z") has no tag yet.
      - name: Version
        id: ver
        run: |
          REL=0; V="0.0.0-dev"
          case "$GITHUB_REF" in
            refs/tags/v*) V="${GITHUB_REF_NAME#v}"; REL=1 ;;
            refs/heads/main)
              C=$(sed -n 's/^## \([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\).*$/\1/p' CHANGELOG.md | head -1)
              if [ -n "$C" ] && ! git ls-remote --exit-code --tags origin "refs/tags/v$C" > /dev/null; then V="$C"; REL=1; fi ;;
          esac
          echo "version=$V" >> "$GITHUB_OUTPUT"; echo "release=$REL" >> "$GITHUB_OUTPUT"; echo "version $V, release $REL"

      # 0.3.0: the zips as the Open MPC catalog reads them, made with the open-mpc release tools (third_party/open-mpc-release,
      # with the L'Cronx apostrophe shell-escaped): -mpc-armv7.zip (Gen1 and the Force), -mpc-aarch64.zip (Gen2) and
      # -mpc-sdk.zip (Akai's one-folder format, MPC OS 3.10.1). The helpers for both CPUs ship in every zip (bin/arm32, bin/arm64).
      - name: Package
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          for A in arm arm64; do
            python3 third_party/open-mpc-release/release.py \
              --so build/$A/evil_tuner_xxl.so \
              --skin "build/skin/L'Cronx - VST - Evil Tuner XXL" \
              --entry build/pluginlist-entry.xml \
              --version "$VERSION" \
              --extra build/helpers/arm32:bin/arm32 \
              --extra build/helpers/arm64:bin/arm64 \
              --user-data user_data \
              --about "Evil Tuner XXL by L'Cronx: internet radio, phone (Roc) and AirPlay into an MPC track, through grains, filter, character, saturator, Erica-style delay, reverb, trance gate and a looper" \
              --requires "a network (Wi-Fi or a phone hotspot)" \
              --id evil-tuner-xxl --repo sunskiefer/Evil-Tuner-XXL --license GPL-3.0-or-later --asset-name Evil-Tuner-XXL \
              -o dist
          done
          python3 third_party/open-mpc-release/sdk_zip.py "dist/Evil-Tuner-XXL-$VERSION-mpc-sdk.zip" \
            "dist/Evil-Tuner-XXL-$VERSION-mpc-armv7.zip" "dist/Evil-Tuner-XXL-$VERSION-mpc-aarch64.zip"
          ls -la dist

      # the apostrophe in L'Cronx must never break the installer
      - name: Installer scripts parse (sh -n)
        run: |
          for a in armv7 aarch64; do
            rm -rf chk && mkdir chk && (cd chk && unzip -q ../dist/*-mpc-$a.zip && sh -n */install.sh && sh -n */uninstall.sh && echo "$a: ok")
          done

      - name: Catalog check
        if: steps.ver.outputs.release == '1'
        run: |
          python3 third_party/open-mpc-release/catalog_check.py dist/*-mpc-armv7.zip --catalog
          python3 third_party/open-mpc-release/catalog_check.py dist/*-mpc-aarch64.zip --catalog

      - uses: actions/upload-artifact@v4
        with:
          name: Evil-Tuner-XXL-mpc
          path: dist/*.zip

      - name: Release
        if: steps.ver.outputs.release == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Evil Tuner XXL ${{ steps.ver.outputs.version }}
          body_path: .github/RELEASE_NOTES.md
          files: dist/*.zip
          prerelease: true

      # A version listed in tested.json (tried on a device) is a full release, not a pre-release; the newest tested one is Latest.
      - name: Promote tested releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for v in $(python3 -c "import json; print(' '.join(sorted({e['version'] for e in json.load(open('tested.json'))})))"); do
            if [ "$(gh release view "v$v" --json isPrerelease -q .isPrerelease 2>/dev/null)" = "true" ]; then
              gh release edit "v$v" --prerelease=false && echo "v$v: now a full release"
            fi
          done
          L=$(python3 -c "import json; v=sorted({e['version'] for e in json.load(open('tested.json'))}, key=lambda x: tuple(int(n) for n in x.split('.'))); print(v[-1])")
          gh release edit "v$L" --latest && echo "v$L: marked Latest"
